# Builds backend/Dockerfile with HF_TOKEN injected via Cloud Build's native Secret
# Manager integration (availableSecrets + secretEnv) — NOT --substitutions/--build-arg,
# which are logged in PLAINTEXT in the build's own history (tried first, reverted for
# exactly that reason). secretEnv values are masked in logs and never persisted in the
# build record. The secret "HF_TOKEN" must already exist in Secret Manager with the
# Cloud Build service account (PROJECT_NUMBER@cloudbuild.gserviceaccount.com) granted
# roles/secretmanager.secretAccessor on it.
#
# HF_TOKEN speeds up / stabilizes the multiple HuggingFace model-precache RUN steps in
# the Dockerfile (CLIP, detoxify, deberta-injection, the topic-check embedding model):
# anonymous HF Hub requests are rate-limited and have repeatedly stalled builds in this
# project past Cloud Build's 60min timeout.
#
# Context is backend/ itself (see scripts/gcloud_deploy_app.sh: `gcloud builds submit
# backend --config backend/cloudbuild.yaml ...`).
steps:
  - name: gcr.io/cloud-builders/docker
    secretEnv: ["HF_TOKEN"]
    entrypoint: bash
    args:
      - -c
      - docker build --build-arg=HF_TOKEN="$$HF_TOKEN" -t ${_IMAGE} .
images: ["${_IMAGE}"]
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/HF_TOKEN/versions/latest
      env: HF_TOKEN
